<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fundo da aba: mesma cor de fundo (navy) usada em todo o site -->
  <circle cx="32" cy="32" r="30" fill="#0d1b2e"/>
  <!-- Anel vermelho, igual ao .logo-badge do navbar (border: 2px solid var(--red)) -->
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="#c8232c" stroke-width="3"/>
  <!-- Iniciais "IL", em itálico/negrito, na cor vermelha da marca -->
  <text x="32" y="32" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-weight="900" font-style="italic"
        font-size="27" fill="#c8232c" letter-spacing="-0.5">IL</text>
</svg>
